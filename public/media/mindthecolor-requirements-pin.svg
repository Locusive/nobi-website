<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1500" viewBox="0 0 1000 1500" role="img" aria-labelledby="title description">
  <title id="title">MindTheColor 3: four checks before buying</title>
  <desc id="description">Source-based requirements: a separately licensed desktop Photoshop 26 or later, Creative Cloud Desktop with .ccx installation permission, Internet at plug-in launch, and one person using the same Adobe account. Shop Nobi may earn a commission. Checked October 17, 2026; not software-tested.</desc>
  <rect width="1000" height="1500" fill="#eef4ff"/>
  <g font-family="Avenir Next,Avenir,Arial,sans-serif" fill="#202b4a">
    <text x="64" y="82" font-size="44" font-weight="800" fill="#3c4fe0">SHOP NOBI</text>
    <text x="64" y="166" font-size="68" font-weight="800">MindTheColor 3</text>
    <text x="64" y="234" font-size="56" font-weight="700">Before you buy</text>
    <g fill="#fff" stroke="#c5d4ed" stroke-width="2">
      <rect x="64" y="280" width="872" height="170" rx="24"/>
      <rect x="64" y="474" width="872" height="170" rx="24"/>
      <rect x="64" y="668" width="872" height="214" rx="24"/>
    </g>
    <text x="94" y="344" font-size="50" font-weight="750">1  Licensed Photoshop 26+</text>
    <text x="94" y="408" font-size="46">Desktop; Adobe is separate.</text>
    <text x="94" y="538" font-size="50" font-weight="750">2  Creative Cloud Desktop</text>
    <text x="94" y="602" font-size="46">Permission to install .ccx.</text>
    <text x="94" y="732" font-size="50" font-weight="750">3  Internet at launch</text>
    <text x="94" y="796" font-size="46">Offline only within the</text>
    <text x="94" y="848" font-size="46">verified Photoshop session.</text>
    <rect x="64" y="906" width="872" height="170" rx="24" fill="#3c4fe0"/>
    <g fill="#fff">
      <text x="94" y="970" font-size="52" font-weight="750">4  One person</text>
      <text x="94" y="1034" font-size="46">Same Adobe account.</text>
    </g>
    <text x="64" y="1140" font-size="44" font-weight="700">Check your setup:</text>
    <text x="64" y="1196" font-size="44" font-weight="700" fill="#3c4fe0">nobi.ai/tools/mindthecolor-fit</text>
    <g font-size="42" fill="#52627b">
      <text x="64" y="1250">Creator manual + license</text>
      <text x="64" y="1302">Checked Oct 17, 2026.</text>
      <text x="64" y="1354">Source-based; not software-tested.</text>
    </g>
    <text x="64" y="1426" font-size="44" font-weight="700" fill="#3c4fe0">We may earn a commission. #ad</text>
  </g>
</svg>
