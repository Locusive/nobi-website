<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1500" viewBox="0 0 1000 1500" role="img" aria-labelledby="title description">
  <title id="title">Two HDMI ports can mirror on RD1 Pro WIN for Mac</title><desc id="description">RD1 on macOS shows A/B/B; a separately labelled illustration shows A/B/C. Manufacturer specifications, not hardware testing. Manual revision not matched. Shop Nobi may earn a commission.</desc>
