<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1500" viewBox="0 0 1000 1500" role="img" aria-labelledby="title description">
  <title id="title">NU1 single 4K60 and simultaneous dual 1440p60 are different claims</title><desc id="description">The sourced NU1 table lists one 4K60 or two 1440p60 screens. Dual-4K marketing conflicts. Software, host and cables need checking. Manufacturer specifications, not hardware testing. Manual revision not matched. Shop Nobi may earn a commission.</desc>
  <style>text{font-family:'Avenir Next',Avenir,Arial,sans-serif;}</style>
  <rect width="1000" height="1500" fill="#f4f7ff"/>
  <text x="80" y="120" font-size="40" font-weight="800" fill="#3f4edb" text-anchor="start">SHOP NOBI</text><text x="80" y="178" font-size="40" font-weight="600" fill="#4b5974" text-anchor="start">NU1 AIR MAC · DISPLAY MODES</text><text x="80" y="268" font-size="72" font-weight="800" fill="#202b4a" text-anchor="start">One 4K screen</text><text x="80" y="348" font-size="72" font-weight="800" fill="#202b4a" text-anchor="start">≠ two 4K screens</text><text x="80" y="412" font-size="40" font-weight="500" fill="#202b4a" text-anchor="start">Use the simultaneous-mode table.</text><rect x="80" y="450" width="840" height="245" rx="26" fill="#ffffff"/><text x="110" y="510" font-size="42" font-weight="700" fill="#3f4edb" text-anchor="start">ONE SCREEN</text><text x="110" y="580" font-size="48" font-weight="700" fill="#202b4a" text-anchor="start">3840 × 2160</text><text x="110" y="638" font-size="42" font-weight="500" fill="#202b4a" text-anchor="start">at 60Hz</text><rect x="555" y="480" width="325" height="160" rx="15" fill="#a8decf" stroke="#202b4a" stroke-width="5"/>
    <path d="M717.5 640v24m-35 0h70" fill="none" stroke="#202b4a" stroke-width="5" stroke-linecap="round"/>
    <text x="717.5" y="583.04" font-size="72" font-weight="700" fill="#202b4a" text-anchor="middle">4K60</text><rect x="80" y="725" width="840" height="245" rx="26" fill="#ffffff"/><text x="110" y="785" font-size="42" font-weight="700" fill="#3f4edb" text-anchor="start">TWO SCREENS</text><text x="110" y="855" font-size="48" font-weight="700" fill="#202b4a" text-anchor="start">2560 × 1440</text><text x="110" y="913" font-size="42" font-weight="500" fill="#202b4a" text-anchor="start">each at 60Hz</text><rect x="525" y="770" width="160" height="145" rx="15" fill="#a8decf" stroke="#202b4a" stroke-width="5"/>
    <path d="M605 915v24m-35 0h70" fill="none" stroke="#202b4a" stroke-width="5" stroke-linecap="round"/>
    <text x="605" y="831.3" font-size="40" font-weight="700" fill="#202b4a" text-anchor="middle">1440p</text><text x="605" y="879.3" font-size="40" font-weight="700" fill="#202b4a" text-anchor="middle">60Hz</text><rect x="725" y="770" width="160" height="145" rx="15" fill="#a8decf" stroke="#202b4a" stroke-width="5"/>
    <path d="M805 915v24m-35 0h70" fill="none" stroke="#202b4a" stroke-width="5" stroke-linecap="round"/>
    <text x="805" y="831.3" font-size="40" font-weight="700" fill="#202b4a" text-anchor="middle">1440p</text><text x="805" y="879.3" font-size="40" font-weight="700" fill="#202b4a" text-anchor="middle">60Hz</text><text x="80" y="1045" font-size="44" font-weight="700" fill="#202b4a" text-anchor="start">Dual-4K marketing conflicts.</text><text x="80" y="1100" font-size="40" font-weight="500" fill="#202b4a" text-anchor="start">DisplayLink + host/cable checks still apply.</text><path d="M80 1145h840" stroke="#d7dfee" stroke-width="3"/><text x="80" y="1190" font-size="40" font-weight="600" fill="#202b4a" text-anchor="start">Source: Baseus NU1 mode table</text><text x="80" y="1245" font-size="40" font-weight="500" fill="#4b5974" text-anchor="start">Specs checked: Oct 17, 2026.</text><text x="80" y="1300" font-size="40" font-weight="500" fill="#4b5974" text-anchor="start">Not hardware-tested.</text><text x="80" y="1355" font-size="40" font-weight="500" fill="#4b5974" text-anchor="start">Manual revision not matched.</text><text x="80" y="1410" font-size="40" font-weight="700" fill="#3f4edb" text-anchor="start">We may earn a commission.</text>
  </svg>
