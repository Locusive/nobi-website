         Nobi runs an MCP (Model Context Protocol) server for AI agents.
         MCP Endpoint: https://api.nobi.ai/.well-known/mcp/460cbe82-9195-424f-a616-b1cb3e3caca0.json?source=website_comment&utm_source=website&utm_medium=mcp&utm_campaign=mcp_discovery&utm_content=head_comment

    <!-- The bundle URL comes from VITE_ASSISTANT_BUNDLE_URL: .env holds the
         production CDN URL, .env.development.local (gitignored) points the dev server at a local build.
         On /shop the bundle boots as Shop Nobi, filling the whole page; on
         every other page it stays the floating marketing-site assistant.
         The path check matches isShopNobiPath in src/utils/shopNobiPage.js.
         A prebuilt search page (/shop/s/<slug>) passes its query to the bundle,
         read from the content scripts/prerender-shop.js puts in the head. -->
    <script>
      // Reserve a conversation ID for the live assistant when the shopper searches. Prebuilt product cards
      // (src/utils/shopNobiProductClick.js) use a separate visit reference and do not require a saved conversation.
      window.shopNobiPageConversationId = isShopNobiPage(window.location.pathname) ? createPageConversationId() : null;

      // The bundle can draw live products before ShopPage, a lazy route, listens, so this flag keeps the first draw.
      // src/utils/shopNobiPrebuiltContent.js reads it.
      if (isShopNobiPage(window.location.pathname)) {
        window.addEventListener('nobi-displayed-product-collection', function () {
          window.shopNobiLiveResultsHaveDrawn = true;
        }, { once: true });
      }

      function isShopNobiPage(path) {
        return path === '/shop' || path.indexOf('/shop/') === 0;
      }

      function createPageConversationId() {
        var browserCrypto = window.crypto;
        if (!browserCrypto) {
          return null;
        }
        if (browserCrypto.randomUUID) {
          return browserCrypto.randomUUID();
        }
        // Older browsers: a version 4 id from random bytes, the same shape randomUUID gives.
        var bytes = browserCrypto.getRandomValues(new Uint8Array(16));
        bytes[6] = (bytes[6] & 15) | 64;
        bytes[8] = (bytes[8] & 63) | 128;
        var hex = Array.prototype.map.call(bytes, function (value) { return (value + 256).toString(16).slice(1); }).join('');
        return [hex.slice(0, 8), hex.slice(8, 12), hex.slice(12, 16), hex.slice(16, 20), hex.slice(20)].join('-');
      }

      function readNobiAssistantOptions() {
        var path = window.location.pathname;
        if (!isShopNobiPage(path)) {
          return { accountId: '460cbe82-9195-424f-a616-b1cb3e3caca0', assistantConfiguration: { floatingChatBar: { buttonLabel: 'Ask Nobi' } } };
        }
        var options = { accountId: '9282b7cb-66ce-4d53-8c37-c291352ef03d', searchResultsPage: true, hideQuickAdd: true };
        var prebuiltContent = document.getElementById('shop-nobi-prebuilt-content');
        var content = prebuiltContent && JSON.parse(prebuiltContent.textContent);
        if (content && content.kind === 'search-page' && content.path === path.replace(/\/+$/, '')) {
          options.openingQuery = content.data.query;
          options.openingConversationId = window.shopNobiPageConversationId;
        }
        return options;
      }
    </script>
    <script src="%VITE_ASSISTANT_BUNDLE_URL%" async onload="window.Nobi.initialize(readNobiAssistantOptions());"></script>

    <!-- Nobi Assistant -->
    <script>
      // Browser tools for Nobi - must be defined before Nobi loads
      window.NobiTools = [
        {
            name: "requestDemo",
            description: "Submit a demo request when someone wants to learn more about Nobi, book a demo, schedule a call, or get in touch with the team. Requires name and email.",
            parameters: {
                type: "object",
                properties: {
                    name: {
                        type: "string",
                        description: "Full name"
                    },
                    email: {
                        type: "string",
                        description: "Email address"
                    },
                    company: {
                        type: "string",
                        description: "Company name (optional)"
                    },
                    website: {
                        type: "string",
                        description: "Company website"
                    },
                    message: {
                        type: "string",
                        description: "Questions, goals, or additional context (optional)"
                    }
                },
                required: ["name", "email", "website"]
            },
            handler: async function(args) {
                const formData = new FormData();
                formData.append("access_key", "c7a3fd79-0e4f-47ce-aa30-c141616d21e3");
                formData.append("subject", "Demo Request via Nobi Chat");
                formData.append("name", args.name);
                formData.append("email", args.email);
                formData.append("company", args.company || "");
                formData.append("website", args.website || "");
                formData.append("message", args.message || "");
                formData.append("botcheck", "");

                const response = await fetch("https://api.web3forms.com/submit", {
                    method: "POST",
                    body: formData
                });

                const result = await response.json();
                if (!response.ok || !result.success) {
                    throw new Error(result.message || "Submission failed");
                }

                return {
                    success: true,
                    message: "Thanks " + args.name + "! We've received your demo request and will contact you at " + args.email + " shortly."
                };
            }
        }
    ];
</script>

<!-- Page helpers -->
<script>
    // Defer video load on tap
    for (const cover of document.querySelectorAll('.video-cover')) {
        cover.addEventListener('click', () => {
            const v = cover.querySelector('video[data-defer]');
            if (!v) return;
            v.removeAttribute('data-defer');
            v.setAttribute('playsinline','');
            v.setAttribute('controls','');
            v.load();
            v.play().catch(()=>{});
        }, { once: true });
    }

    // Lock body scroll when a drawer opens
    const drawer = document.querySelector('.drawer');
    const lock = (on) => document.body.style.overflow = on ? 'hidden' : '';
    if (drawer) {
        const mo = new MutationObserver(() => lock(drawer.getAttribute('aria-hidden') === 'false'));
        mo.observe(drawer, { attributes:true, attributeFilter:['aria-hidden'] });
    }

    // Safe 100vh fallback
    (function(){
        const setVh = ()=> document.documentElement.style.setProperty('--vh', `${window.innerHeight*0.01}px`);
        setVh(); window.addEventListener('resize', setVh);
    })();
</script>
