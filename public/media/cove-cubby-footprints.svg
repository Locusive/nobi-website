<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Cubby and Cove exterior dimensions at one scale</title><desc id="desc">Cubby is 15.2 inches wide by 21.2 inches deep. Cove is 16 inches wide by 26 inches deep. These rectangles represent exterior bounds, not usable litter area. Manufacturer dimensions checked October 16, 2026.</desc><rect width="720" height="400" fill="#f5f8ff"/><g fill="#202b4a" font-family="Avenir Next, Avenir, Arial, sans-serif"><text x="188.39999999999998" y="35" text-anchor="middle" font-size="27" font-weight="700">Cubby</text><text x="188.39999999999998" y="65" text-anchor="middle" font-size="18">15.2 in wide</text><path d="M120 80H256.79999999999995M120 75V85M256.79999999999995 75V85" fill="none" stroke="#53617e" stroke-width="1.5"/><rect x="120" y="98" width="136.79999999999998" height="190.79999999999998" fill="#a3decf" stroke="#202b4a" stroke-width="2"/><path d="M100 98V288.79999999999995M95 98H105M95 288.79999999999995H105" fill="none" stroke="#53617e" stroke-width="1.5"/><text x="86" y="193.39999999999998" transform="rotate(-90 86 193.39999999999998)" text-anchor="middle" font-size="18">21.2 in deep</text><text x="532" y="35" text-anchor="middle" font-size="27" font-weight="700">Cove</text><text x="532" y="65" text-anchor="middle" font-size="18">16 in wide</text><path d="M460 80H604M460 75V85M604 75V85" fill="none" stroke="#53617e" stroke-width="1.5"/><rect x="460" y="98" width="144" height="234" fill="#c9d0fc" stroke="#202b4a" stroke-width="2"/><path d="M440 98V332M435 98H445M435 332H445" fill="none" stroke="#53617e" stroke-width="1.5"/><text x="426" y="215" transform="rotate(-90 426 215)" text-anchor="middle" font-size="18">26 in deep</text><text x="360" y="382" text-anchor="middle" font-size="15" fill="#53617e">Exterior bounds at the same scale. Allow room for access.</text></g></svg>