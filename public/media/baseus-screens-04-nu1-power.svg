<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1500" viewBox="0 0 1000 1500" role="img" aria-labelledby="title description">
  <title id="title">NU1 100W input and stated laptop allocation are different</title><desc id="description">Alternative 100W-input cases show 90W laptop allocation with one USB port and 75W with all USB ports. Other loads are not specified here. Charger/cables are separate and host PD support matters. Manufacturer specifications, not hardware testing. Manual revision not matched. Shop Nobi may earn a commission.</desc>
  <style>text{font-family:'Avenir Next',Avenir,Arial,sans-serif;}</style>
  <rect width="1000" height="1500" fill="#f4f7ff"/>
  <text x="80" y="120" font-size="40" font-weight="800" fill="#3f4edb" text-anchor="start">SHOP NOBI</text><text x="80" y="178" font-size="40" font-weight="600" fill="#4b5974" text-anchor="start">NU1 AIR MAC · LAPTOP POWER</text><text x="80" y="268" font-size="72" font-weight="800" fill="#202b4a" text-anchor="start">100W in ≠ 100W</text><text x="80" y="348" font-size="72" font-weight="800" fill="#202b4a" text-anchor="start">to your laptop.</text><text x="80" y="412" font-size="40" font-weight="500" fill="#202b4a" text-anchor="start">Two alternative, stated allocations:</text><rect x="80" y="450" width="840" height="245" rx="26" fill="#ffffff"/><text x="110" y="505" font-size="42" font-weight="700" fill="#3f4edb" text-anchor="start">ONE USB PORT IN USE</text><rect x="120" y="540" width="155" height="90" rx="16" fill="#ccd0fb"/><text x="197" y="600" font-size="44" font-weight="700" fill="#202b4a" text-anchor="middle">100W</text><text x="115" y="670" font-size="40" font-weight="600" fill="#4b5974" text-anchor="start">INPUT</text><path d="M320 590h130m-18-18 18 18-18 18" fill="none" stroke="#3f4edb" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="555" y="540" width="325" height="100" rx="16" fill="#a8decf"/><text x="717" y="610" font-size="72" font-weight="700" fill="#202b4a" text-anchor="middle">90W</text><text x="717" y="675" font-size="40" font-weight="600" fill="#4b5974" text-anchor="middle">TO LAPTOP</text><text x="500" y="755" font-size="48" font-weight="800" fill="#3f4edb" text-anchor="middle">OR</text><rect x="80" y="785" width="840" height="245" rx="26" fill="#ffffff"/><text x="110" y="840" font-size="42" font-weight="700" fill="#3f4edb" text-anchor="start">ALL USB PORTS IN USE</text><rect x="120" y="875" width="155" height="90" rx="16" fill="#ccd0fb"/><text x="197" y="935" font-size="44" font-weight="700" fill="#202b4a" text-anchor="middle">100W</text><text x="115" y="1005" font-size="40" font-weight="600" fill="#4b5974" text-anchor="start">INPUT</text><path d="M320 925h130m-18-18 18 18-18 18" fill="none" stroke="#3f4edb" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="555" y="875" width="325" height="100" rx="16" fill="#a8decf"/><text x="717" y="945" font-size="72" font-weight="700" fill="#202b4a" text-anchor="middle">75W</text><text x="717" y="1010" font-size="40" font-weight="600" fill="#4b5974" text-anchor="middle">TO LAPTOP</text><text x="80" y="1085" font-size="40" font-weight="500" fill="#202b4a" text-anchor="start">Charger + cables separate; PD host needed.</text><text x="80" y="1130" font-size="40" font-weight="500" fill="#202b4a" text-anchor="start">Other USB loads are unlisted here.</text><path d="M80 1145h840" stroke="#d7dfee" stroke-width="3"/><text x="80" y="1190" font-size="40" font-weight="600" fill="#202b4a" text-anchor="start">Source: Baseus NU1 power diagram</text><text x="80" y="1245" font-size="40" font-weight="500" fill="#4b5974" text-anchor="start">Specs checked: Oct 17, 2026.</text><text x="80" y="1300" font-size="40" font-weight="500" fill="#4b5974" text-anchor="start">Not hardware-tested.</text><text x="80" y="1355" font-size="40" font-weight="500" fill="#4b5974" text-anchor="start">Manual revision not matched.</text><text x="80" y="1410" font-size="40" font-weight="700" fill="#3f4edb" text-anchor="start">We may earn a commission.</text>
  </svg>
