<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1500" viewBox="0 0 1000 1500" role="img" aria-labelledby="title description">
  <title id="title">RD1 Windows simultaneous modes depend on the host DP and DSC path</title><desc id="description">DP1.4 with DSC lists dual 4K60, DP1.4 without DSC lists dual 4K30 and DP1.2 lists dual 1080p60. Unlisted mixed paths need checking. Manufacturer specifications, not hardware testing. Manual revision not matched. Shop Nobi may earn a commission.</desc>
  <style>text{font-family:'Avenir Next',Avenir,Arial,sans-serif;}</style>
  <rect width="1000" height="1500" fill="#f4f7ff"/>
  <text x="80" y="120" font-size="40" font-weight="800" fill="#3f4edb" text-anchor="start">SHOP NOBI</text><text x="80" y="178" font-size="40" font-weight="600" fill="#4b5974" text-anchor="start">RD1 PRO WIN · WINDOWS</text><text x="80" y="268" font-size="72" font-weight="800" fill="#202b4a" text-anchor="start">Two 4K60 screens?</text><text x="80" y="348" font-size="72" font-weight="800" fill="#202b4a" text-anchor="start">First, check DSC.</text><text x="80" y="412" font-size="40" font-weight="500" fill="#202b4a" text-anchor="start">Your host path changes the listed mode.</text><rect x="80" y="450" width="840" height="180" rx="26" fill="#ffffff"/><text x="110" y="550" font-size="44" font-weight="700" fill="#202b4a" text-anchor="start">DP1.4 + DSC</text><path d="M425 535h100m-18-18 18 18-18 18" fill="none" stroke="#3f4edb" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="580" y="475" width="135" height="70" rx="15" fill="#a8decf" stroke="#202b4a" stroke-width="5"/>
    <path d="M647.5 545v24m-35 0h70" fill="none" stroke="#202b4a" stroke-width="5" stroke-linecap="round"/>
    <rect x="755" y="475" width="135" height="70" rx="15" fill="#a8decf" stroke="#202b4a" stroke-width="5"/>
    <path d="M822.5 545v24m-35 0h70" fill="none" stroke="#202b4a" stroke-width="5" stroke-linecap="round"/>
    <text x="735" y="610" font-size="42" font-weight="700" fill="#202b4a" text-anchor="middle">4K60 EACH</text><rect x="80" y="660" width="840" height="180" rx="26" fill="#ffffff"/><text x="110" y="730" font-size="44" font-weight="700" fill="#202b4a" text-anchor="start">DP1.4</text><text x="110" y="785" font-size="44" font-weight="700" fill="#202b4a" text-anchor="start">without DSC</text><path d="M425 745h100m-18-18 18 18-18 18" fill="none" stroke="#3f4edb" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="580" y="685" width="135" height="70" rx="15" fill="#a8decf" stroke="#202b4a" stroke-width="5"/>
    <path d="M647.5 755v24m-35 0h70" fill="none" stroke="#202b4a" stroke-width="5" stroke-linecap="round"/>
    <rect x="755" y="685" width="135" height="70" rx="15" fill="#a8decf" stroke="#202b4a" stroke-width="5"/>
    <path d="M822.5 755v24m-35 0h70" fill="none" stroke="#202b4a" stroke-width="5" stroke-linecap="round"/>
    <text x="735" y="820" font-size="42" font-weight="700" fill="#202b4a" text-anchor="middle">4K30 EACH</text><rect x="80" y="870" width="840" height="180" rx="26" fill="#ffffff"/><text x="110" y="970" font-size="44" font-weight="700" fill="#202b4a" text-anchor="start">DP1.2</text><path d="M425 955h100m-18-18 18 18-18 18" fill="none" stroke="#3f4edb" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="580" y="895" width="135" height="70" rx="15" fill="#a8decf" stroke="#202b4a" stroke-width="5"/>
    <path d="M647.5 965v24m-35 0h70" fill="none" stroke="#202b4a" stroke-width="5" stroke-linecap="round"/>
    <rect x="755" y="895" width="135" height="70" rx="15" fill="#a8decf" stroke="#202b4a" stroke-width="5"/>
    <path d="M822.5 965v24m-35 0h70" fill="none" stroke="#202b4a" stroke-width="5" stroke-linecap="round"/>
    <text x="735" y="1030" font-size="42" font-weight="700" fill="#202b4a" text-anchor="middle">1080p60 EACH</text><text x="80" y="1090" font-size="40" font-weight="500" fill="#202b4a" text-anchor="start">Full-featured host + cables required.</text><text x="80" y="1135" font-size="40" font-weight="500" fill="#202b4a" text-anchor="start">Unknown/mixed modes need checking.</text><path d="M80 1145h840" stroke="#d7dfee" stroke-width="3"/><text x="80" y="1190" font-size="40" font-weight="600" fill="#202b4a" text-anchor="start">Source: Baseus RD1 resolution guide</text><text x="80" y="1245" font-size="40" font-weight="500" fill="#4b5974" text-anchor="start">Specs checked: Oct 17, 2026.</text><text x="80" y="1300" font-size="40" font-weight="500" fill="#4b5974" text-anchor="start">Not hardware-tested.</text><text x="80" y="1355" font-size="40" font-weight="500" fill="#4b5974" text-anchor="start">Manual revision not matched.</text><text x="80" y="1410" font-size="40" font-weight="700" fill="#3f4edb" text-anchor="start">We may earn a commission.</text>
  </svg>
